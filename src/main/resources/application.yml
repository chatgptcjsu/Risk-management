spring:
  application:
    name: safety-on
  datasource:
    url: jdbc:mariadb://${SAFETY_DB_HOST:127.0.0.1}:${SAFETY_DB_PORT:3306}/${SAFETY_DB_NAME:safety_on}?useUnicode=true&characterEncoding=utf8
    username: ${SAFETY_DB_USERNAME:safety_on}
    password: ${SAFETY_DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 110MB
      location: ${java.io.tmpdir}
server:
  address: 0.0.0.0
  port: ${PORT:3000}
  tomcat:
    max-http-form-post-size: 110MB
    max-swallow-size: 110MB
safety:
  storage-directory: ${SAFETY_STORAGE_DIRECTORY:./data/uploads}
  bootstrap-admin:
    username: ${SAFETY_ADMIN_USERNAME:admin}
    password: ${SAFETY_ADMIN_PASSWORD:}
    display-name: ${SAFETY_ADMIN_DISPLAY_NAME:시스템 관리자}
